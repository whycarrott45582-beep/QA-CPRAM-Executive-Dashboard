# secrets_template.toml
# ============================================================
# คัดลอกเนื้อหานี้ไปวางใน Streamlit Cloud → App Settings → Secrets
# (ใส่ค่าจริงจากไฟล์ service_account.json ที่ดาวน์โหลดจาก Google Cloud)
# ============================================================

# ── Google Service Account ──────────────────────────────────
[gdrive]
type = "service_account"
project_id = "your-project-id"
private_key_id = "xxxxxxxxxxxxxxxxxxxx"
private_key = "-----BEGIN RSA PRIVATE KEY-----\nMIIE...\n-----END RSA PRIVATE KEY-----\n"
client_email = "qa-cpram@your-project.iam.gserviceaccount.com"
client_id = "000000000000000000000"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/qa-cpram%40your-project.iam.gserviceaccount.com"

# ── Google Drive Folder ID ──────────────────────────────────
[gdrive_config]
# ID ของโฟลเดอร์ QA_Root ใน Google Drive
# หาจาก URL: drive.google.com/drive/folders/<ID อยู่ตรงนี้>
root_folder_id = "1AbCdEfGhIjKlMnOpQrStUvWxYz"
